<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Crestward Labs</title>
<meta name="description" content="The page you're looking for doesn't exist or has been moved.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="/logo-icon.png">
<link rel="apple-touch-icon" href="/logo-icon.png">
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/archivo-latin.woff2" crossorigin>
<link rel="stylesheet" href="/assets/page.css">
<style>
  /* the 404 is a single centred statement rather than a document */
  .frame-404 {
    min-height: calc((100vh / var(--cw-zoom)) - 58px);
    display: flex; flex-direction: column;
  }
  .center {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    align-items: flex-start; /* otherwise the badge stretches the full column */
    padding: clamp(48px, 9vw, 110px) clamp(20px, 3.4vw, 44px);
  }
  .code {
    font-size: clamp(72px, 16vw, 168px); font-weight: 700; letter-spacing: -0.05em;
    line-height: 0.9; color: var(--accent); margin-bottom: 18px;
  }
  .center p { max-width: 46ch; font-size: clamp(14.5px, 1.5vw, 16px); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand">
      <img src="/logo-icon.png" alt="">
      <span>Crestward Labs</span>
    </a>
    <a href="/" class="nav-link">Back to site</a>
  </div>
</nav>

<div class="frame frame-404">
  <main class="center">
    <div class="badge">Error</div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 5 5 12 12 19"/></svg>
        Back to home
      </a>
      <a href="mailto:hello@crestwardlabs.com" class="btn btn-ghost">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Contact us
      </a>
    </div>
  </main>

  <footer class="foot">
    <span>© 2026 Crestward Labs · Vancouver, BC</span>
    <a href="/">crestwardlabs.com</a>
  </footer>
</div>

</body>
</html>
